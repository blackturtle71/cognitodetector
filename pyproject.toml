[project]
name = "cognitive-impairments"
version = "0.0.0"
description = "Dissertation experiments for cognitive-impairment classification from speech."
readme = "README.md"
requires-python = "==3.11.0"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "openai-whisper==20250625",
    "opensmile==2.6.0",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.1",
    "shap==0.51.0",
    "torch==2.11.0",
    "tqdm==4.67.1",
    "transformers==5.17.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
